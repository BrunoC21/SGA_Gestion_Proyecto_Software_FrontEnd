<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard</title>
        <link rel="stylesheet" href="./home.component.css">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    </head>
    <body>

        <div class="cont-sup-btns">
            <button class="carousel-btn prev">&#10094;</button>
            <div class="cont-sup">
                <div class="carousel-container">
                    <div class="carousel-track">
                        <img src="/src/app/images/fondo.jpg" class="carousel-slide" alt="Slide 1">
                        <img src="/src/app/images/fondo.jpg" class="carousel-slide" alt="Slide 2">
                        <img src="/src/app/images/fondo.jpg" class="carousel-slide" alt="Slide 3">
                        <img src="/src/app/images/fondo.jpg" class="carousel-slide" alt="Slide 4">
                        <img src="/src/app/images/fondo.jpg" class="carousel-slide" alt="Slide 5">
                        <img src="/src/app/images/fondo.jpg" class="carousel-slide" alt="Slide 6">
                    </div>
                </div>

                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
        
            </div>
            <button class="carousel-btn next">&#10095;</button>
        </div>

        <div class="cont-categorias">
            <h2>Categorias mas populares</h2>
            <div class="cont-btns">
                <div class="cont-btn">
                    <button id="cat-1"><i class='bx bxs-capsule'></i></button>
                    <p>Analgésicos</p>
                </div>
                <div class="cont-btn">
                    <button id="cat-2"><i class='bx bx-capsule'></i></button>
                    <p>Antibióticos</p>
                </div>
                <div class="cont-btn">
                    <button id="cat-3"><i class='bx bxs-virus'></i></button>
                    <p>Antigripales</p>
                </div>
                <div class="cont-btn">
                    <button id="cat-4"><i class='bx bx-check-shield'></i></button>
                    <p>Gastrointestinales</p>
                </div>
                <div class="cont-btn">
                    <button id="cat-5"><i class='bx bx-plus-medical'></i></button>
                    <p>Vitaminas y 
                         Suplementos</p>
                </div>
                <div class="cont-btn">
                    <button id="cat-6"><i class='bx bx-spray-can'></i></button>
                    <p>Antialérgicos</p>
                </div>
            </div>
        </div>
        <div class="separado-catergorias"></div>

        <div class="cont-ofertas">
            <h2>Ofertas Destacadas</h2>
        </div>

        <div class="product-carousel-wrapper">

  <div class="carousel-controls">
    <button (click)="mostrarPrev()" class="carousel-arrow">&#10094;</button>

    <div class="product-carousel">
      <div
        class="product-card"
        *ngFor="let producto of productos | sliceProducts: startIndex : 4"
      >
        <img [src]="producto.imagen" alt="{{ producto.titulo }}" class="product-img" />

        <div class="product-info">
          <h4 class="product-title">{{ producto.titulo }}</h4>
          <p class="product-desc">{{ producto.descripcion }}</p>
          <p class="product-price">$ {{ producto.precio}}</p>
        </div>

        <button class="add-to-cart">Agregar</button>
      </div>
    </div>

    <button (click)="mostrarNext()" class="carousel-arrow">&#10095;</button>
  </div>
</div>

    </body>
    <script>
        const track = document.querySelector('.carousel-track');
        const slides = Array.from(document.querySelectorAll('.carousel-slide'));
        const dots = document.querySelectorAll('.dot');
        const prevBtn = document.querySelector('.carousel-btn.prev');
        const nextBtn = document.querySelector('.carousel-btn.next');

        let currentIndex = 0;
        const totalSlides = slides.length;
        let autoSlide;

        function updateCarousel(index) {
            track.style.transform = `translateX(-${index * 90}vw)`;

            dots.forEach(dot => dot.classList.remove('active'));
            dots[index].classList.add('active');

            currentIndex = index;
        }

        function nextSlide() {
            const nextIndex = (currentIndex + 1) % totalSlides;
            updateCarousel(nextIndex);
        }

        function prevSlide() {
            const prevIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            updateCarousel(prevIndex);
        }

        nextBtn.addEventListener('click', () => {
            nextSlide();
            resetAutoSlide();
        });

        prevBtn.addEventListener('click', () => {
            prevSlide();
            resetAutoSlide();
        });

        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                updateCarousel(index);
                resetAutoSlide();
            });
        });

        function startAutoSlide() {
            autoSlide = setInterval(nextSlide, 5000); // cambia cada 5 segundos
        }

        function resetAutoSlide() {
            clearInterval(autoSlide);
            startAutoSlide();
        }

        startAutoSlide();
    </script>
</html>
